[package]
name = "csvchk"
version = "0.2.5"
edition = "2021"
readme = "README.md"
authors = ["Ken Youens-Clark <kyclark@gmail.com>"]
description = "Vertical view of delimited text records"
license = "BSD-3-Clause"
repository = "https://github.com/kyclark/csvchk"
categories = ["command-line-utilities"]
keywords = ["csv", "tsv", "delimited"]

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
anyhow = "1.0.79"
csv = "1.3.0"
tabular = "0.2.0"
regex = "1.10.3"

[dev-dependencies]
assert_cmd = "2.0.13"
predicates = "3.0.4"
rand = "0.8.5"
pretty_assertions = "1.4.0"
